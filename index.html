<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
          table, th, td {
            border: 1px solid;
          }
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>
      
          <img src="plate_blue.jpg" width="50">
          <img src="plate_yellow.jpg" width="50">
      
        <table>
            <thead>
                <tr>
                    <th>Meal</th>
                    <th>Ingredients</th>
                    <th>Price</th>
                </tr>

            </thead>
            <tbody>
                
                <tr>
                    <td>Pizza</td>
                    <td>Tomato, basil, whatever the hell you want</td>
                    <td>$9.50</td>
                </tr>

                <tr>
                    <td>Pasta al' Pesto</td>
                    <td>Nuts, basil, and it's not gluten free</td>
                    <td>$12.00</td>
                </tr>

                <tr>
                    <td>Salad</td>
                    <td>Lettuce, tomatoes, cucumbers</td>
                    <td>$8.00</td>
                </tr>

            </tbody>
        </table>


    </body>
</html>
